services:
  - type: web
    name: backend-app
    env: docker
    plan: free

    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: JAVA_VERSION
        value: 17

      - key: JPA_DDL_AUTO
        value: update
      - key: JPA_SHOW_SQL
        value: "false"

      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN_IDLE
        value: "2"
      - key: DB_POOL_CONN_TIMEOUT_MS
        value: "30000"
      - key: DB_POOL_IDLE_TIMEOUT_MS
        value: "600000"
      - key: DB_POOL_MAX_LIFETIME_MS
        value: "1800000"
      - key: DB_POOL_KEEPALIVE_MS
        value: "300000"
