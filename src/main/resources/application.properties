spring.application.name=backend-app

server.port=${PORT:${SERVER_PORT:8080}}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-d8adsqegvqtc73cplq00-a.oregon-postgres.render.com:5432/api_inventario?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:api_inventario_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# 👇 AGREGAR ESTAS LÍNEAS (son importantes)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:300000}

spring.h2.console.enabled=true

security.jwt.secret=${JWT_SECRET:dev-only-change-me-please-set-JWT_SECRET}
security.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
security.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

